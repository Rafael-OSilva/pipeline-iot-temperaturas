
services:
  postgres:
    image: postgres:16
    container_name: pipeline_iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot_temperaturas
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_temperaturas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
